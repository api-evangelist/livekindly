consumption_note: >-
  To use what LIVEKINDLY does expose, no package is needed. The content API is anonymous HTTP GET
  against https://thelivekindlyco.com/wp-json/wp/v2 — any HTTP client works, and any generic
  WordPress REST client library (none of them first-party) will bind to it. The MCP endpoint is
  reachable by any standard MCP client that can complete an OAuth authorization-code + PKCE flow;
  see mcp/livekindly-mcp.yml and scopes/livekindly-scopes.yml.
