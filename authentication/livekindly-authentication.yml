schemes:
- name: applicationPassword
  type: http
  scheme: basic
  description: >-
    WordPress Application Passwords over HTTP Basic. Issued per-user from
    https://thelivekindlyco.com/wp-admin/authorize-application.php. Required for every write
    operation on wp/v2 and for the routes that return author or settings data.
  applies_to: livekindly:content
  sources:
