docs_note: >-
  LIVEKINDLY publishes no developer or authentication documentation. The baseline below was
  derived mechanically from the OpenAPI in this repo (itself derived from the live
  https://thelivekindlyco.com/wp-json/ route index) and then upgraded with the OAuth 2.0
  authorization-server metadata LIVEKINDLY actually serves at /.well-known/, which the spec
  derivation cannot see.
note: >-
  Two independent authentication models coexist on thelivekindlyco.com. (1) The wp/v2 content API
  is ANONYMOUS for reads — every collection in openapi/ returned 200 with no credential — and
  falls back to WordPress Application Passwords over HTTP Basic (or logged-in cookie +
  X-WP-Nonce in a browser) for writes. (2) The MCP endpoints are protected by a real OAuth 2.0
  authorization server with PKCE and a single "mcp" scope. Neither model is documented by
  LIVEKINDLY anywhere a developer would find it.
