aid: livekindly
name: LIVEKINDLY
description: 'LIVEKINDLY Collective (thelivekindlyco.com) is a global plant-based food company
  founded in March 2020 by Roger Lienhard around a mission to make plant-based living the new
  norm. It is a house of alternative-protein brands — Fry''s Family Food Co., Like Meat, Oumph!
  and The No Meat Company — sold across Europe, the UK, South Africa and North America, and it
  also runs a B2B Solutions arm supplying plant-based protein to other food businesses. The
  Collective raised over half a billion dollars across its early rounds, reported profitability in
  November 2025, announced it was joining forces with TiNDLE Foods in December 2025, and was
  certified as a B Corp in June 2026. LIVEKINDLY publishes no developer platform, no documentation
  portal and no OpenAPI. The machine-readable surface on thelivekindlyco.com is its WordPress REST
  API (wp/v2), which serves the corporate newsroom, the brand and partner directories, the careers
  listings, pages and media library as anonymously readable JSON, alongside a WordPress MCP
  Adapter endpoint that is live and fronted by a real RFC 8414 OAuth authorization server — but is
  authentication-gated to a single "mcp" scope. The company is tracked on the Forge Global
  secondary market.'
