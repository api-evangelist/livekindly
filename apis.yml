apis:
- aid: livekindly:mcp
  name: LIVEKINDLY MCP Server (WordPress MCP Adapter)
  description: >-
    A Model Context Protocol server advertised in the thelivekindlyco.com WordPress REST route index under
    the "mcp" namespace, with two endpoints — mcp-adapter-default-server and mcp-oauth-server. Unlike
    most WordPress MCP Adapter installs, this one publishes a real RFC 8414 authorization-server metadata
    document and an RFC 9728 protected-resource document at the site root, declaring PKCE S256, authorization_code
    + refresh_token grants and a single "mcp" scope. Both endpoints are live but authentication-gated:
    an anonymous JSON-RPC tools/list returns HTTP 401 (mcp_unauthorized on the OAuth server, rest_forbidden
    on the default server), as does the companion wp-abilities/v1 registry, so the published tool set
    could not be enumerated.
  humanURL: https://thelivekindlyco.com/wp-json/mcp
  baseURL: https://thelivekindlyco.com/wp-json/mcp/mcp-oauth-server
  tags:
  - MCP
  - Agents
  - Authentication
  tags_raw:
  - MCP
  - Agents
  - OAuth
