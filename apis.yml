apis:
- aid: livekindly:content
  name: LIVEKINDLY Content API (WordPress REST wp/v2)
  description: 'The anonymously readable WordPress REST API that thelivekindlyco.com serves at
    /wp-json/wp/v2 — the corporate newsroom and LiveKindly Blog (39 posts), the corporate site
    pages (19), the brand directory (custom post type `brand`: Fry''s Family Food Co., Like Meat,
    Oumph!, The No Meat Company), the partner directory (custom post type `partner`: PHW Group,
    RCL Foods, Ospelt, Coest), open roles (custom post type `job`, 6 listed), the media library
    (1,145 attachments), taxonomies and a site-wide search endpoint. Responses are JSON with
    page/per_page pagination and X-WP-Total / X-WP-TotalPages headers. This is the CMS content
    API, not a LIVEKINDLY product API; LIVEKINDLY publishes no OpenAPI for it, so the definition
    in this repo was derived mechanically from the live route-discovery document at
    https://thelivekindlyco.com/wp-json/.'
  humanURL: https://thelivekindlyco.com/latest-news/
