          type: string
          default: wp/v2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400': &id001
          $ref: '#/components/responses/Error'
        '401': *id001
        '403': *id001
        '404': *id001
      x-anonymous-access: true
