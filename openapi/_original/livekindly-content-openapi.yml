      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        '400': *id001
        '401': *id001
        '403': *id001
        '404': *id001
      security:
      - applicationPassword: []
      - cookieNonce: []
      x-anonymous-access: false
