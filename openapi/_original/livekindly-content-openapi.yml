openapi: 3.1.0
info:
  title: LIVEKINDLY Content API (WordPress REST wp/v2)
  version: wp/v2
  summary: 'Public read surface of thelivekindlyco.com content: newsroom posts, corporate pages, the brand and partner
    directories, open roles, media and site search.'
  description: 'LIVEKINDLY Collective publishes thelivekindlyco.com on WordPress, which exposes the WordPress REST
    API at https://thelivekindlyco.com/wp-json/. The wp/v2 namespace is anonymously readable and returns the company
    newsroom and LiveKindly Blog, corporate pages, the `brand` directory (Fry’s Family Food Co., Like Meat, Oumph!,
    The No Meat Company), the `partner` directory (PHW Group, RCL Foods, Ospelt, Coest), the `job` careers listings,
    the media library, taxonomies and a site-wide search endpoint as JSON.


    This document was DERIVED mechanically by API Evangelist from the route-discovery document served at https://thelivekindlyco.com/wp-json/
    on 2026-08-04 — every path, method and parameter below is taken verbatim from that descriptor. LIVEKINDLY does
    not publish an OpenAPI definition of its own, and this is not a product API: it is the content API the CMS exposes.
    Write operations exist on these routes but require authentication (WordPress Application Passwords over HTTP
    Basic).'
  contact:
    name: LIVEKINDLY Collective
    url: https://thelivekindlyco.com/
  x-derived-by: API Evangelist enrichment pipeline
  x-derived-from: https://thelivekindlyco.com/wp-json/
  x-derived-on: '2026-08-04'
  x-provider-published: false
servers:
- url: https://thelivekindlyco.com/wp-json
  description: Production
